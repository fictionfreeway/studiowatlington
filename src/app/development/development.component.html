<div id="dev-container" class="component-container">
    <div class="links" style="color: var(--deep-blue)">
      <a routerLink="/contact">CONTACT</a>
      <span style="pointer-events: none"> | </span>
      <a routerLink="/clients">RETURNING CLIENTS</a>
    </div>
    <div id="whiteboard-container" #whiteboard>
      <div id="whiteboard-close" (click)="closeShowcase()">X</div>
      <div #showcaseList id="showcase-list">
        <h2>Designed, Developed, Delivered</h2>
        <h4>&#40;click a project for more info&#41;</h4>
        <ul>
          <li *ngFor="let item of showcases" id="{{item.title}}" (click)="titleClicked(item)">
            {{ item.title }}
          </li>
        </ul>
        <div id="showcase-container" *ngIf="selectedShowcase.title">
          {{ selectedShowcase.title }}
        </div>
      </div>
      <div #showcase id="showcase" class="fade-in" *ngIf="selectedShowcase.title">
        <div id="showcase-content" [ngClass]="{'erasing': isErasing}" #showcaseContent>
          <img [src]="selectedShowcase.image" alt="{{ selectedShowcase.title }}" />
          <div id="showcase-text-container">
            <h2 style="margin-top: 0;">{{ selectedShowcase.title }}</h2>
            <p #showcaseDescription>
              {{ selectedShowcase.description }}
              <a class="showcase-button" href="https://events.brrl.us" *ngIf="selectedShowcase.buttonText" target="_blank">
                {{ selectedShowcase.buttonText }}
              </a>
            </p>
          </div>
        </div>
      </div>
    </div>
    <!-- Fixed arrow buttons – only visible when a showcase is selected -->
    <img src="assets/images/left-arrow-dev.png" class="arrow left-arrow" (click)="prevShowcase()"
         *ngIf="selectedShowcase.title" alt="Previous showcase" />
    <img src="assets/images/right-arrow-dev.png" class="arrow right-arrow" (click)="nextShowcase()"
         *ngIf="selectedShowcase.title" alt="Next showcase" />
